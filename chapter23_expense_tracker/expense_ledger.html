<style>
/* ══════════════════════════════════════════════════════════════════════════
   Industry design system — tokens + component layer, verbatim from
   _ds/industry-5e3304eb-eb29-400f-8a28-ec586a79787a/styles.css
   ══════════════════════════════════════════════════════════════════════ */
:root {
  --color-bg: #f2f2f3;
  --color-surface: #e9e9ea;
  --color-text: #1d1f20;
  --color-accent: #5980a6;
  --color-accent-2: #728fab;
  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);

  --color-neutral-100: #f5f5f8;
  --color-neutral-200: #e7e7ea;
  --color-neutral-300: #d4d4d7;
  --color-neutral-400: #b7b7ba;
  --color-neutral-500: #98989b;
  --color-neutral-600: #7a7a7d;
  --color-neutral-700: #5d5d60;
  --color-neutral-800: #424244;
  --color-neutral-900: #2b2b2d;

  --color-accent-100: #eef6ff;
  --color-accent-200: #d6ebff;
  --color-accent-300: #b5d9fd;
  --color-accent-400: #94bce3;
  --color-accent-500: #749dc4;
  --color-accent-600: #597ea3;
  --color-accent-700: #416180;
  --color-accent-800: #2c455d;
  --color-accent-900: #1d2d3d;

  --color-accent-2-100: #eef6ff;
  --color-accent-2-200: #d6ebff;
  --color-accent-2-300: #bdd8f2;
  --color-accent-2-400: #9ebbd8;
  --color-accent-2-500: #7e9cb8;
  --color-accent-2-600: #627d98;
  --color-accent-2-700: #486077;
  --color-accent-2-800: #314457;
  --color-accent-2-900: #1f2d3a;

  --font-heading: "Barlow Condensed", system-ui, sans-serif;
  --font-heading-weight: 600;
  --font-body: "Barlow", system-ui, sans-serif;

  --space-1: 3.4px;
  --space-2: 6.8px;
  --space-3: 10.2px;
  --space-4: 13.6px;
  --space-6: 20.4px;
  --space-8: 27.2px;

  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 7px;

  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);
}

body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; } h2 { font-size: 32px; } h3 { font-size: 25px; }
h4 { font-size: 20px; } h5 { font-size: 16px; } h6 { font-size: 13px; }
h6 { letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text);
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-bg); }
.btn-primary:hover { background: var(--color-accent-600); }
.btn-primary:active { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-block { width: 100%; margin-top: var(--space-2); }

.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }

.card {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);
}

.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px;
  border-radius: calc(var(--radius-md) * 0.75);
}
.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }

.nav {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-bottom: none;
}
.nav-brand {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 18px; margin-right: auto;
}

/* blueprint frame: the system's default shape language is square,
   transparent, hairline-bordered — the soft-tone layer below intentionally
   overrides this half of the sheet for a rounded, filled variant. */
.card, .btn, .input, .tag { border-radius: 0; }
.card { background: transparent; border: 1px solid var(--color-divider); }
.btn { border: 1px solid var(--color-divider); }
.btn-primary { border-color: var(--color-accent); }

/* ══════════════════════════════════════════════════════════════════════════
   Soft tone — verbatim tokens/rules from
   "지출 기록 (부드럽게).dc.html", layered on top of the sheet above
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --font-heading:"Barlow","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Barlow","Noto Sans KR",system-ui,sans-serif;
  --soft-bg:#f4f3f0;
  --soft-card:#fffefd;
  --soft-line:color-mix(in srgb, var(--color-text) 7%, transparent);
  --soft-hair:color-mix(in srgb, var(--color-text) 5%, transparent);
  --soft-track:color-mix(in srgb, var(--color-accent) 12%, transparent);
  --soft-track-fill:color-mix(in srgb, var(--color-accent) 40%, transparent);
  --soft-trend-fill:color-mix(in srgb, var(--color-accent) 28%, transparent);
  --soft-chip:color-mix(in srgb, var(--color-accent) 12%, transparent);
  --soft-danger:#a34b3f;
  --soft-shadow:0 1px 2px color-mix(in srgb, var(--color-text) 4%, transparent);
}
body{margin:0;background:var(--soft-bg);color:var(--color-text);font-family:var(--font-body);}
a{color:var(--color-accent-700);text-decoration:none}
a:hover{color:var(--color-accent)}

/* soft-tone shape overrides: rounded, filled, pill — the deliberate
   departure from the blueprint frame's square/hairline/transparent rule */
.card{
  display:block; background:var(--soft-card); border:1px solid var(--soft-line);
  border-radius:18px; padding:30px 34px; box-shadow:var(--soft-shadow);
}
.card-tight{padding:26px 30px}
.btn{
  border-radius:999px; border-color:var(--soft-hair); background:var(--soft-hair);
  font-family:var(--font-body); font-weight:500; font-size:13.5px; padding:9px 18px;
}
.btn:hover{background:color-mix(in srgb, var(--color-text) 9%, transparent)}
.btn-primary{background:var(--color-accent); color:var(--soft-card); border-color:var(--color-accent)}
.btn-primary:hover{background:var(--color-accent-600)}
.btn-sm{padding:7px 15px; font-size:13px}
.input{
  min-height:40px; padding:8px 13px; background:var(--soft-bg);
  border-color:var(--soft-line); border-radius:12px;
}
.input:hover{border-color:color-mix(in srgb, var(--color-text) 30%, transparent)}
.tag{border-radius:999px}

*,*::before,*::after{box-sizing:border-box}
button{font:inherit}
.tabular{font-variant-numeric:tabular-nums}

/* ══════════════════════════════════════════════════════════════════════════
   Page-specific — 지출 기록 (expense ledger), built on the tokens above
   ══════════════════════════════════════════════════════════════════════ */
.wrap{max-width:1180px; margin:0 auto; padding:36px 24px 80px; display:flex; flex-direction:column; gap:18px}

.topbar{display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:0 4px}
.brand{font-weight:600; font-size:21px; letter-spacing:-.01em; margin-right:auto}
.file-meta{font-size:12.5px; opacity:.45}
.actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap}

.tabs{display:flex; gap:6px; background:var(--soft-hair); padding:4px; border-radius:999px; max-width:100%; overflow-x:auto; scrollbar-width:thin}
.tab{
  flex:0 0 auto; white-space:nowrap;
  padding:6px 15px; font-weight:500; font-size:13px; border:none; border-radius:999px;
  cursor:pointer; background:transparent; color:var(--color-text); transition:background .15s ease;
}
.tab:hover{background:color-mix(in srgb, var(--color-text) 6%, transparent)}
.tab[aria-current="true"]{background:var(--color-accent); color:var(--soft-card)}
.tab[aria-current="true"]:hover{background:var(--color-accent-600)}
.tab-empty{padding:6px 15px; font-size:13px; opacity:.45}

.label{font-size:12.5px; opacity:.5}

.total-row{display:flex; align-items:flex-end; gap:12px; margin-top:2px}
.total-num{font-weight:600; font-size:clamp(38px,6vw,70px); line-height:1; letter-spacing:-.025em}
.total-unit{font-size:22px; padding-bottom:8px; opacity:.4}
.total-sub{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px}
.delta-pill{font-size:13px; padding:5px 12px; border-radius:999px; background:var(--soft-chip); color:var(--color-accent-800)}
.total-count{font-size:13px; opacity:.5}

.comment-row{display:flex; gap:10px; align-items:flex-start; margin-top:22px; padding-top:18px; border-top:1px solid var(--soft-line)}
.comment-label{font-size:12.5px; opacity:.45; white-space:nowrap; padding-top:1px}
.comment-body{display:flex; flex-direction:column; gap:5px}
.verdict-title{font-size:14.5px; font-weight:600; line-height:1.5; text-wrap:pretty}
.verdict-detail{font-size:13px; line-height:1.7; opacity:.6; text-wrap:pretty}

.split{display:grid; grid-template-columns:1fr 1fr; gap:18px}

.catrow{display:flex; flex-direction:column; gap:7px}
.catrow + .catrow{margin-top:16px}
.catrow-top{display:flex; justify-content:space-between; align-items:baseline; font-size:13.5px}
.catrow-amt{font-weight:500; font-size:15px}
.catrow-share{opacity:.4; font-size:12.5px}
.bar-track{height:9px; border-radius:999px; background:var(--soft-track); overflow:hidden}
.bar-fill{height:100%; border-radius:999px; background:var(--soft-track-fill)}
.bar-fill.top{background:var(--color-accent)}

.trend{display:flex; align-items:flex-end; gap:16px; height:200px; margin-top:4px}
.trend-col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; height:100%; gap:8px}
.trend-bar{width:100%; border-radius:10px 10px 4px 4px; background:var(--soft-trend-fill)}
.trend-bar.cur{background:var(--color-accent)}
.trend-label{text-align:center; font-size:12.5px; opacity:.45}

.cal-block{margin-top:20px; padding-top:18px; border-top:1px solid var(--soft-line)}
.cal-head{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
.cal-head span{text-align:center; font-size:10.5px; opacity:.4}
.calendar{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:5px}
.cal-cell{
  aspect-ratio:1; width:100%; border-radius:6px; display:flex; align-items:center; justify-content:center;
  background:var(--soft-hair);
}
.cal-cell.empty{background:transparent}
.cal-day-num{font-size:9.5px; font-weight:500; opacity:.5}
.cal-cell.has-spend .cal-day-num{opacity:.9; color:var(--soft-card)}
.cal-cell.today{box-shadow:0 0 0 1.5px var(--color-accent) inset}
.cal-cell.has-spend{cursor:pointer; transition:transform .12s ease, filter .12s ease}
.cal-cell.has-spend:hover{transform:scale(1.08); filter:brightness(1.08)}
.cal-cell.has-spend:active{transform:scale(.97)}

.day-modal-backdrop{
  position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
  padding:20px; background:color-mix(in srgb, var(--color-text) 45%, transparent);
  animation:fadeIn .15s ease both;
}
.day-modal{
  width:min(420px,100%); max-height:80vh; overflow-y:auto; background:var(--soft-card);
  border-radius:18px; padding:26px 28px; box-shadow:0 12px 32px color-mix(in srgb, var(--color-text) 22%, transparent);
  animation:fadeInUp .2s ease both;
}
.day-modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px}
.day-modal-title{font-weight:600; font-size:18px}
.day-modal-close{
  width:30px; height:30px; border:none; border-radius:999px; background:var(--soft-hair);
  color:var(--color-text); cursor:pointer; font-size:15px; line-height:1;
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
}
.day-modal-close:hover{background:color-mix(in srgb, var(--color-text) 12%, transparent)}
.day-modal-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--soft-line)}
.day-modal-row:last-child{border-bottom:none}
.day-modal-cat{
  width:68px; flex:0 0 68px; text-align:center; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap;
}
.day-modal-desc{flex:1; font-size:14px; min-width:0}
.day-modal-amt{
  width:88px; flex:0 0 88px; text-align:right;
  font-weight:500; font-size:15px; white-space:nowrap;
}
.day-modal-total{
  display:flex; justify-content:space-between; align-items:baseline; margin-top:14px; padding-top:14px;
  border-top:1px solid var(--soft-line); font-weight:600; font-size:16px;
}

.list-head{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px}
.list-toggle{
  display:flex; align-items:center; gap:8px; background:transparent; border:none;
  padding:2px 0; margin:0; cursor:pointer; color:inherit;
}
.list-toggle-chev{
  display:inline-flex; font-size:11px; opacity:.5; transition:transform .2s ease;
}
.list-toggle[aria-expanded="true"] .list-toggle-chev{transform:rotate(90deg)}
#listBody{margin-top:14px}
.row-list{display:flex; flex-direction:column}
.exp-row{display:flex; align-items:center; gap:16px; padding:13px 4px; border-bottom:1px solid var(--soft-line)}
.exp-row:last-child{border-bottom:none}
.exp-date{width:56px; flex:0 0 56px; font-weight:500; font-size:13.5px; opacity:.45}
.exp-cat{width:74px; flex:0 0 74px; text-align:center; font-size:12.5px; padding:4px 6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.exp-desc{flex:1; font-size:14px; min-width:0}
.exp-amt{font-weight:500; font-size:16px; white-space:nowrap}
.exp-actions{display:flex; gap:4px; flex:0 0 auto}
.exp-act{
  width:26px; height:26px; padding:0; border:none; border-radius:999px;
  background:transparent; color:var(--color-text); opacity:.4; cursor:pointer;
  font-size:13px; line-height:1; display:flex; align-items:center; justify-content:center;
}
.exp-act:hover{opacity:1; background:var(--soft-hair)}
.exp-act[data-act="del"]:hover{color:var(--soft-danger)}
.empty-note{font-size:13px; opacity:.5; padding:8px 0}

.form-card{display:none; margin-top:-2px}
.form-card.open{display:flex; flex-direction:column; gap:var(--space-6)}
.form-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:var(--space-4); align-items:end}
.form-actions{grid-column:1 / -1; display:flex; gap:10px; align-items:center}
.form-error{font-size:12.5px; color:var(--soft-danger); min-height:1.4em}

/* ══════════════════════════════════════════════════════════════════════════
   Motion — hover/press feedback + entrance animations for freshly-rendered
   elements. Guarded by prefers-reduced-motion below.
   ══════════════════════════════════════════════════════════════════════ */
.card{transition:box-shadow .2s ease, transform .2s ease}
.card:hover{box-shadow:0 4px 16px color-mix(in srgb, var(--color-text) 8%, transparent); transform:translateY(-1px)}
.btn{transition:background .15s ease, transform .1s ease}
.btn:active{transform:scale(.96)}
.tab{transition:background .15s ease, transform .1s ease}
.tab:active{transform:scale(.96)}
.exp-act{transition:opacity .15s ease, background .15s ease, transform .1s ease}
.exp-act:active{transform:scale(.85)}

.bar-fill{transform-origin:left; animation:growX .7s cubic-bezier(.16,1,.3,1) both}
.trend-bar{transform-origin:bottom; animation:growY .6s cubic-bezier(.16,1,.3,1) both}
@keyframes growX{from{transform:scaleX(0)} to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)} to{transform:scaleY(1)}}

.exp-row, .cal-cell.has-spend{animation:fadeInUp .35s ease both}
.exp-row:nth-child(1){animation-delay:.02s} .exp-row:nth-child(2){animation-delay:.04s}
.exp-row:nth-child(3){animation-delay:.06s} .exp-row:nth-child(4){animation-delay:.08s}
.exp-row:nth-child(5){animation-delay:.10s} .exp-row:nth-child(6){animation-delay:.12s}
.exp-row:nth-child(7){animation-delay:.14s} .exp-row:nth-child(8){animation-delay:.16s}
.exp-row:nth-child(n+9){animation-delay:.18s}
@keyframes fadeInUp{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:translateY(0)}}

.total-num{transition:opacity .15s ease}
.card, .split > .card{animation:fadeIn .3s ease both}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}

@media (prefers-reduced-motion: reduce){
  .card, .btn, .tab, .exp-act, .bar-fill, .trend-bar, .exp-row, .cal-cell.has-spend{
    animation:none !important; transition:none !important;
  }
  .card:hover{transform:none}
}

@media (max-width:900px){
  .split{grid-template-columns:1fr}
  .card{padding:22px}
  .card-tight{padding:22px}
  .form-grid{grid-template-columns:1fr 1fr}
  .file-meta{display:none}
  .total-num{font-size:52px}
}
</style>

<div class="wrap">
  <div class="topbar">
    <span class="brand">지출 기록</span>
    <span class="file-meta" id="statusText"></span>
    <div class="tabs" id="monthTabs"></div>
    <div class="actions">
      <button class="btn btn-primary" id="addToggle">+ 지출 추가</button>
    </div>
  </div>

  <form class="card form-card" id="addForm" novalidate>
    <div class="form-grid">
      <div class="field">
        <label for="f-date">날짜</label>
        <input type="date" id="f-date" class="input" required>
      </div>
      <div class="field">
        <label for="f-category">카테고리</label>
        <input type="text" id="f-category" class="input" placeholder="예: 식비" list="f-category-list" autocomplete="off" required>
        <datalist id="f-category-list"></datalist>
      </div>
      <div class="field">
        <label for="f-desc">내용</label>
        <input type="text" id="f-desc" class="input" placeholder="예: 점심" required>
      </div>
      <div class="field">
        <label for="f-amount">금액</label>
        <input type="number" id="f-amount" class="input" placeholder="0" min="1" step="1" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-sm" id="submitLabel">추가</button>
        <button type="button" class="btn btn-sm" id="cancelAdd">취소</button>
        <span class="form-error" id="formError"></span>
      </div>
    </div>
  </form>

  <div class="card">
    <div class="label" id="monthLabel">이번 달 합계</div>
    <div class="total-row">
      <span class="total-num tabular" id="totalNum">0</span>
      <span class="total-unit">원</span>
    </div>
    <div class="total-sub">
      <span class="delta-pill tabular" id="deltaStr">-</span>
      <span class="total-count tabular" id="countStr">0건 · 하루 평균 0원</span>
    </div>
    <div class="comment-row">
      <span class="comment-label">코멘트</span>
      <span class="comment-body">
        <span class="verdict-title" id="verdictTitle">기록된 지출이 없습니다</span>
        <span class="verdict-detail" id="verdictBody">지출을 추가하면 이 달의 흐름을 요약해드립니다.</span>
      </span>
    </div>
  </div>

  <div class="split">
    <div class="card card-tight">
      <div class="label">카테고리별 합계</div>
      <div id="catList" style="margin-top:18px"></div>
      <div class="empty-note" id="catEmpty" hidden>이 달에는 기록된 지출이 없습니다.</div>
    </div>
    <div class="card card-tight">
      <div class="label">월별 추이</div>
      <div class="trend" id="trend"></div>
      <div class="trend" id="trendLabelsRow" style="height:auto;margin-top:0"></div>
      <div class="cal-block">
        <div class="list-head" style="margin-bottom:8px">
          <div class="label">일별 지출</div>
          <span class="total-count tabular" id="calMeta"></span>
        </div>
        <div class="cal-head" id="calHead"></div>
        <div class="calendar" id="calendar"></div>
      </div>
    </div>
  </div>

  <div class="card card-tight">
    <div class="list-head">
      <button type="button" class="list-toggle" id="listToggle" aria-expanded="false">
        <span class="list-toggle-chev" id="listToggleChev">▸</span>
        <span class="label" style="margin:0">내역 목록</span>
      </button>
      <span class="total-count tabular" id="listMeta">0건</span>
    </div>
    <div id="listBody" hidden>
      <div class="row-list" id="rows"></div>
      <div class="empty-note" id="listEmpty" hidden>표시할 내역이 없습니다.</div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var API = "/api/expenses";
  var fmt = function(n){ return Math.round(n).toLocaleString("en-US"); };

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var listCollapsed = true;
  var lastTotal = null;
  function animateTotal(el, to){
    var from = lastTotal === null ? to : lastTotal;
    lastTotal = to;
    if(reduceMotion || from === to){ el.textContent = fmt(to); return; }
    var start = performance.now();
    var duration = 500;
    function step(now){
      var t = Math.min(1, (now - start) / duration);
      var eased = 1 - Math.pow(1 - t, 3);
      el.textContent = fmt(from + (to - from) * eased);
      if(t < 1) requestAnimationFrame(step);
      else el.textContent = fmt(to);
    }
    requestAnimationFrame(step);
  }

  function fetchExpenses(){
    return fetch(API).then(function(r){
      if(!r.ok) throw new Error("fetch failed");
      return r.json();
    });
  }

  function applyRows(rows){
    state.rows = rows.map(function(r, i){ return Object.assign({ id: i }, r); });
    render();
  }

  var state = { rows: [], month: null, editingId: null };

  function monthKey(dateStr){ return dateStr.slice(0,7); }

  function daysInMonth(ym){
    var y = parseInt(ym.slice(0,4),10), m = parseInt(ym.slice(5,7),10);
    return new Date(y, m, 0).getDate();
  }
  function firstWeekday(ym){
    var y = parseInt(ym.slice(0,4),10), m = parseInt(ym.slice(5,7),10);
    return new Date(y, m-1, 1).getDay();
  }

  function josa(word, withBatchim, withoutBatchim){
    var last = word.charCodeAt(word.length - 1);
    if(last >= 0xAC00 && last <= 0xD7A3){
      return ((last - 0xAC00) % 28 !== 0) ? withBatchim : withoutBatchim;
    }
    return withBatchim;
  }

  function pickSeed(str){
    var h = 0;
    for(var i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
    return h;
  }

  function render(){
    var rows = state.rows.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; });

    var catListDatalist = document.getElementById("f-category-list");
    var knownCats = [];
    rows.forEach(function(r){ if(knownCats.indexOf(r.category) < 0) knownCats.push(r.category); });
    knownCats.sort(function(a,b){ return a.localeCompare(b, "ko"); });
    catListDatalist.innerHTML = "";
    knownCats.forEach(function(c){
      var opt = document.createElement("option");
      opt.value = c;
      catListDatalist.appendChild(opt);
    });

    var keys = [];
    rows.forEach(function(r){
      var k = monthKey(r.date);
      if(keys.indexOf(k) < 0) keys.push(k);
    });
    keys.sort();

    var monthTabsEl = document.getElementById("monthTabs");
    monthTabsEl.innerHTML = "";
    if(!keys.length){
      var empty = document.createElement("span");
      empty.className = "tab-empty";
      empty.textContent = "데이터 없음";
      monthTabsEl.appendChild(empty);
    }else{
      if(!state.month || keys.indexOf(state.month) < 0) state.month = keys[keys.length-1];
      keys.forEach(function(k){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "tab";
        b.textContent = k.replace("-", " / ");
        b.setAttribute("aria-current", String(k === state.month));
        b.addEventListener("click", function(){ state.month = k; render(); });
        monthTabsEl.appendChild(b);
      });
    }

    var monthTotals = keys.map(function(k){
      return rows.filter(function(r){ return monthKey(r.date) === k; })
                  .reduce(function(s,r){ return s + r.amount; }, 0);
    });
    var mMax = Math.max.apply(null, monthTotals.concat([1]));

    var trendEl = document.getElementById("trend");
    var trendLabelsEl = document.getElementById("trendLabelsRow");
    trendEl.innerHTML = ""; trendLabelsEl.innerHTML = "";
    keys.forEach(function(k, i){
      var col = document.createElement("div");
      col.className = "trend-col";
      var bar = document.createElement("div");
      bar.className = "trend-bar" + (k === state.month ? " cur" : "");
      bar.style.height = Math.max(6, (monthTotals[i] / mMax) * 100) + "%";
      bar.title = k.replace("-"," / ") + " · " + fmt(monthTotals[i]) + "원";
      col.appendChild(bar);
      trendEl.appendChild(col);
      var labCol = document.createElement("div");
      labCol.className = "trend-col";
      labCol.style.height = "auto";
      var lab = document.createElement("div");
      lab.className = "trend-label";
      lab.textContent = parseInt(k.slice(5),10) + "월";
      labCol.appendChild(lab);
      trendLabelsEl.appendChild(labCol);
    });

    var mine = keys.length ? rows.filter(function(r){ return monthKey(r.date) === state.month; }) : [];
    var idx = keys.indexOf(state.month);
    var total = mine.reduce(function(s,r){ return s + r.amount; }, 0);
    var prev = idx > 0 ? monthTotals[idx-1] : null;
    var dayCount = mine.length ? Math.max.apply(null, mine.map(function(r){ return parseInt(r.date.slice(8),10); })) : 1;

    var calHeadEl = document.getElementById("calHead");
    var calEl = document.getElementById("calendar");
    var calMetaEl = document.getElementById("calMeta");
    calHeadEl.innerHTML = ""; calEl.innerHTML = "";
    if(!keys.length){
      calMetaEl.textContent = "";
    }else{
      ["일","월","화","수","목","금","토"].forEach(function(w){
        var s = document.createElement("span");
        s.textContent = w;
        calHeadEl.appendChild(s);
      });
      var dayTotals = {};
      mine.forEach(function(r){
        var dnum = parseInt(r.date.slice(8),10);
        dayTotals[dnum] = (dayTotals[dnum]||0) + r.amount;
      });
      var dayMax = Math.max.apply(null, Object.keys(dayTotals).map(function(k){ return dayTotals[k]; }).concat([1]));
      var lead = firstWeekday(state.month);
      var totalDays = daysInMonth(state.month);
      var today = todayStr();
      for(var b=0;b<lead;b++){
        var blank = document.createElement("div");
        blank.className = "cal-cell empty";
        calEl.appendChild(blank);
      }
      for(var day=1; day<=totalDays; day++){
        var cell = document.createElement("div");
        var amt = dayTotals[day] || 0;
        var isToday = (state.month + "-" + String(day).padStart(2,"0")) === today;
        cell.className = "cal-cell" + (amt>0 ? " has-spend" : "") + (isToday ? " today" : "");
        if(amt > 0){
          var intensity = Math.min(1, amt / dayMax);
          cell.style.background = "color-mix(in srgb, var(--color-accent) " + Math.round(20 + intensity*70) + "%, var(--soft-hair))";
        }
        var numEl = document.createElement("span");
        numEl.className = "cal-day-num";
        numEl.textContent = String(day);
        cell.appendChild(numEl);
        if(amt > 0){
          var cellDate = state.month + "-" + String(day).padStart(2,"0");
          cell.title = day + "일 · " + fmt(amt) + "원";
          cell.addEventListener("click", function(d){
            return function(){ showDayModal(d, mine); };
          }(cellDate));
        }
        calEl.appendChild(cell);
      }
      var spendDays = Object.keys(dayTotals).length;
      calMetaEl.textContent = spendDays + "일 지출 · 최고 " + fmt(dayMax) + "원";
    }

    document.getElementById("monthLabel").textContent = keys.length ? (parseInt(state.month.slice(5),10) + "월 합계") : "이번 달 합계";
    animateTotal(document.getElementById("totalNum"), total);
    document.getElementById("countStr").textContent = mine.length + "건 · 하루 평균 " + fmt(mine.length ? Math.round(total/dayCount/100)*100 : 0) + "원";
    var deltaEl = document.getElementById("deltaStr");
    if(prev === null){
      deltaEl.textContent = "이전 달 없음";
    }else{
      var delta = total - prev;
      var deltaPct = prev ? Math.round((delta/prev)*100) : 0;
      deltaEl.textContent = "전월 대비 " + (delta>=0?"+":"−") + fmt(Math.abs(delta)) + "원 (" + (delta>=0?"+":"−") + Math.abs(deltaPct) + "%)";
    }

    var catMap = {};
    mine.forEach(function(r){ catMap[r.category] = (catMap[r.category]||0) + r.amount; });
    var entries = Object.keys(catMap).map(function(k){ return [k, catMap[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
    var catMax = entries.length ? entries[0][1] : 1;

    var catListEl = document.getElementById("catList");
    catListEl.innerHTML = "";
    document.getElementById("catEmpty").hidden = entries.length > 0;
    entries.forEach(function(e, i){
      var name = e[0], amount = e[1];
      var row = document.createElement("div");
      row.className = "catrow";
      var top = document.createElement("div");
      top.className = "catrow-top";
      top.innerHTML = "<span>" + escapeHTML(name) + "</span><span class=\"catrow-amt tabular\">" + fmt(amount) +
        " <span class=\"catrow-share tabular\">" + Math.round((amount/(total||1))*100) + "%</span></span>";
      var track = document.createElement("div");
      track.className = "bar-track";
      var fill = document.createElement("div");
      fill.className = "bar-fill" + (i===0 ? " top" : "");
      fill.style.width = Math.max(3, (amount/catMax)*100) + "%";
      track.appendChild(fill);
      row.appendChild(top); row.appendChild(track);
      catListEl.appendChild(row);
    });

    var big = mine.length ? mine.reduce(function(a,b){ return b.amount > a.amount ? b : a; }) : null;
    var bigShare = big ? Math.round((big.amount/(total||1))*100) : 0;
    var avg = mine.length ? total/mine.length : 0;

    var verdictTitle = document.getElementById("verdictTitle");
    var verdictBody = document.getElementById("verdictBody");
    if(!mine.length){
      verdictTitle.textContent = keys.length ? "이 달에는 기록된 지출이 없습니다" : "기록된 지출이 없습니다";
      verdictBody.textContent = keys.length ? "다른 달을 선택해 보세요." : "위의 \"+ 지출 추가\"로 첫 지출을 기록해보세요.";
    }else{
      var topCat = entries[0][0];
      var catShare = Math.round((entries[0][1]/(total||1))*100);
      var topCatRows = mine.filter(function(r){ return r.category === topCat; });
      var bigInTop = topCatRows.reduce(function(a,b){ return b.amount > a.amount ? b : a; });
      var bigInTopShare = Math.round((bigInTop.amount/(entries[0][1]||1))*100);
      var bigWhen = bigInTop.date.slice(5).replace("-","월 ") + "일";
      var seed = pickSeed(topCat + "|" + state.month);
      var projected = Math.round(total/dayCount*30/1000)*1000;
      var ramyunCount = Math.max(1, Math.round(projected/1200));

      if(catShare >= 45){
        var hotTitles = [
          "이번 달 너 = " + topCat + " 그 자체임",
          topCat + " 지출 실화냐 ㅋㅋ 정신 안 차리냐",
          topCat + josa(topCat, "이", "가") + " 이번 달 니 통장 접수함",
          "손모가지 나갈 뻔... " + topCat + " " + catShare + "%면 말 다했다",
          topCat + " 앞에서 지갑 각도 90도 숙이는 중",
          "이러다 " + topCat + " 파산각, 진지하게 각성 필요함",
          topCat + " 폭주기관차 여기서 못 멈추면 다음 달 진짜 골로 감"
        ];
        var hotBodies = [
          "이 달 지출의 " + catShare + "%가 " + topCat + " 하나에 몰렸다. 이 페이스로 30일까지 가면 총 " + fmt(projected) + "원, 라면 " + ramyunCount + "봉지 값이 그냥 " + topCat + "로 증발한 거임. 반박 불가.",
          topCat + "에만 " + fmt(entries[0][1]) + "원(전체 " + catShare + "%). 이대로면 다음 달 초 카드값 문자 보고 그대로 얼어붙는다. 지금이라도 손목 붙잡아야 함.",
          "야심 차게 " + topCat + "에 " + catShare + "% 몰빵함. " + bigWhen + " " + bigInTop.description + " 한 건이 " + topCat + " 지출의 " + bigInTopShare + "%(" + fmt(bigInTop.amount) + "원) 담당임. 이거 보고도 안 웃기면 진짜 위험한 거임.",
          "이 속도면 월말 예상 지출 " + fmt(projected) + "원 각. " + topCat + " 여기서 안 멈추면 다음 달은 삼각김밥 풀타임 로테이션 확정임.",
          topCat + " 지출 이미 " + catShare + "% 찍음. 지금 브레이크 안 밟으면 월말 잔고는 라면 살 돈도 없을 각이다 진심."
        ];
        verdictTitle.textContent = hotTitles[seed % hotTitles.length];
        verdictBody.textContent = hotBodies[seed % hotBodies.length];
      }else if(catShare >= 30){
        var warnTitles = [
          topCat + " 쓰는 속도 실화냐",
          topCat + josa(topCat, "이", "가") + " 슬금슬금 지출 1위 먹었다",
          topCat + " 지출 한 번은 보고 가야 할 듯",
          "이 정도면 " + topCat + " 편애 아니냐는 말 나올 각",
          topCat + " 이대로 두면 다음 달엔 진짜 위험함",
          "경고: " + topCat + " " + catShare + "% 찍음"
        ];
        var warnBodies = [
          "이 달 지출의 " + catShare + "%가 " + topCat + "에 몰렸고, 그중 " + bigInTopShare + "%는 " + bigWhen + " " + bigInTop.description + " 한 건(" + fmt(bigInTop.amount) + "원)이다. 지금은 버틸만 해도 이 페이스 유지하면 다음 달 진짜 라면 신세 각이다.",
          topCat + " 비중 " + catShare + "%까지 올라옴. 이 속도로 30일까지 가면 총 " + fmt(projected) + "원, 슬슬 " + topCat + "만 눈여겨봐도 되는 수준.",
          "지금 속도면 다음 달도 " + topCat + " 1위 자리 지킬 기세임. 건당 평균 " + fmt(avg) + "원, 지금 멈추면 아직 안 늦었음.",
          topCat + josa(topCat, "이", "가") + " " + catShare + "%까지 올라온 거 보면 이번 달 " + topCat + " 없이 하루도 안 지나간 셈이다. 딱 여기까지만 하자."
        ];
        verdictTitle.textContent = warnTitles[seed % warnTitles.length];
        verdictBody.textContent = warnBodies[seed % warnBodies.length];
      }else{
        verdictTitle.textContent = "특별히 튀는 지출은 없습니다";
        verdictBody.textContent = "가장 큰 카테고리는 " + topCat + "(" + catShare +
          "%), 가장 큰 한 건은 " + big.description + " " + fmt(big.amount) + "원입니다. 건당 평균은 " + fmt(avg) + "원입니다.";
      }
    }

    var rowsEl = document.getElementById("rows");
    rowsEl.innerHTML = "";
    var listed = mine.slice().reverse();
    document.getElementById("listEmpty").hidden = listed.length > 0;
    document.getElementById("listMeta").textContent = listed.length + "건";
    var listMaxAmount = mine.length ? Math.max.apply(null, mine.map(function(r){ return r.amount; })) : 1;
    listed.forEach(function(r){
      var intensity = Math.max(0, Math.min(1, r.amount / listMaxAmount));
      var row = document.createElement("div");
      row.className = "exp-row";
      row.style.background = "linear-gradient(90deg, color-mix(in srgb, var(--soft-danger) " +
        Math.round(intensity * 30) + "%, transparent), transparent 75%)";
      row.innerHTML =
        "<span class=\"exp-date tabular\">" + escapeHTML(r.date.slice(5)) + "</span>" +
        "<span class=\"exp-cat tag tag-neutral\">" + escapeHTML(r.category) + "</span>" +
        "<span class=\"exp-desc\">" + escapeHTML(r.description) + "</span>" +
        "<span class=\"exp-amt tabular\" style=\"color:color-mix(in srgb, var(--soft-danger) " +
          Math.round(intensity * 90) + "%, var(--color-text))\">" + fmt(r.amount) + "원</span>" +
        "<span class=\"exp-actions\">" +
          "<button type=\"button\" class=\"exp-act\" data-act=\"edit\" title=\"수정\">✎</button>" +
          "<button type=\"button\" class=\"exp-act\" data-act=\"del\" title=\"삭제\">×</button>" +
        "</span>";
      row.querySelector("[data-act=edit]").addEventListener("click", function(){ startEdit(r.id); });
      row.querySelector("[data-act=del]").addEventListener("click", function(){ deleteRow(r.id); });
      rowsEl.appendChild(row);
    });

    document.getElementById("listBody").hidden = listCollapsed;
    var listToggleEl = document.getElementById("listToggle");
    listToggleEl.setAttribute("aria-expanded", String(!listCollapsed));

    document.getElementById("statusText").textContent = "expense_tracker DB · " + rows.length + "건";
  }

  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;" }[c];
    });
  }

  var addToggle = document.getElementById("addToggle");
  var addForm = document.getElementById("addForm");
  var formError = document.getElementById("formError");
  var submitLabel = document.getElementById("submitLabel");

  function todayStr(){
    var d = new Date();
    var mm = String(d.getMonth()+1).padStart(2,"0");
    var dd = String(d.getDate()).padStart(2,"0");
    return d.getFullYear() + "-" + mm + "-" + dd;
  }

  function closeForm(){
    addForm.classList.remove("open");
    addForm.reset();
    formError.textContent = "";
    state.editingId = null;
    submitLabel.textContent = "추가";
  }

  function startEdit(id){
    var r = state.rows.find(function(x){ return x.id === id; });
    if(!r) return;
    state.editingId = id;
    document.getElementById("f-date").value = r.date;
    document.getElementById("f-category").value = r.category;
    document.getElementById("f-desc").value = r.description;
    document.getElementById("f-amount").value = r.amount;
    submitLabel.textContent = "수정 완료";
    formError.textContent = "";
    addForm.classList.add("open");
    document.getElementById("f-date").scrollIntoView({ block: "center", behavior: "smooth" });
    document.getElementById("f-date").focus();
  }

  function deleteRow(id){
    var r = state.rows.find(function(x){ return x.id === id; });
    if(!r) return;
    if(!confirm(r.date + " · " + r.category + " · " + r.description + " (" + fmt(r.amount) + "원) 삭제할까요?")) return;
    fetch(API + "/" + id, { method: "DELETE" })
      .then(function(res){ if(!res.ok) throw new Error("delete failed"); return res.json(); })
      .then(function(rows){
        if(state.editingId === id) closeForm();
        applyRows(rows);
      })
      .catch(function(){ alert("삭제에 실패했습니다. 서버(server.py)가 실행 중인지 확인해 주세요."); });
  }

  function closeDayModal(){
    var el = document.getElementById("dayModalBackdrop");
    if(el) el.remove();
    document.removeEventListener("keydown", onDayModalKeydown);
  }

  function onDayModalKeydown(ev){
    if(ev.key === "Escape") closeDayModal();
  }

  function showDayModal(dateStr, monthRows){
    closeDayModal();
    var dayRows = monthRows.filter(function(r){ return r.date === dateStr; });
    var total = dayRows.reduce(function(s,r){ return s + r.amount; }, 0);
    var day = parseInt(dateStr.slice(8),10);
    var month = parseInt(dateStr.slice(5,7),10);

    var backdrop = document.createElement("div");
    backdrop.className = "day-modal-backdrop";
    backdrop.id = "dayModalBackdrop";
    backdrop.addEventListener("click", function(ev){ if(ev.target === backdrop) closeDayModal(); });

    var modal = document.createElement("div");
    modal.className = "day-modal";

    var head = document.createElement("div");
    head.className = "day-modal-head";
    head.innerHTML = "<span class=\"day-modal-title\">" + month + "월 " + day + "일</span>";
    var closeBtn = document.createElement("button");
    closeBtn.type = "button";
    closeBtn.className = "day-modal-close";
    closeBtn.textContent = "×";
    closeBtn.addEventListener("click", closeDayModal);
    head.appendChild(closeBtn);
    modal.appendChild(head);

    dayRows.forEach(function(r){
      var row = document.createElement("div");
      row.className = "day-modal-row";
      row.innerHTML =
        "<span class=\"day-modal-cat tag tag-neutral\">" + escapeHTML(r.category) + "</span>" +
        "<span class=\"day-modal-desc\">" + escapeHTML(r.description) + "</span>" +
        "<span class=\"day-modal-amt tabular\">" + fmt(r.amount) + "원</span>";
      modal.appendChild(row);
    });

    var totalRow = document.createElement("div");
    totalRow.className = "day-modal-total";
    totalRow.innerHTML = "<span>합계</span><span class=\"tabular\">" + fmt(total) + "원</span>";
    modal.appendChild(totalRow);

    backdrop.appendChild(modal);
    document.body.appendChild(backdrop);
    document.addEventListener("keydown", onDayModalKeydown);
  }

  addToggle.addEventListener("click", function(){
    if(addForm.classList.contains("open")){
      closeForm();
      return;
    }
    state.editingId = null;
    submitLabel.textContent = "추가";
    addForm.classList.add("open");
    var dateField = document.getElementById("f-date");
    if(!dateField.value) dateField.value = todayStr();
    dateField.focus();
  });
  document.getElementById("cancelAdd").addEventListener("click", closeForm);

  document.getElementById("listToggle").addEventListener("click", function(){
    listCollapsed = !listCollapsed;
    document.getElementById("listBody").hidden = listCollapsed;
    this.setAttribute("aria-expanded", String(!listCollapsed));
  });

  addForm.addEventListener("submit", function(ev){
    ev.preventDefault();
    var date = document.getElementById("f-date").value;
    var category = document.getElementById("f-category").value.trim();
    var description = document.getElementById("f-desc").value.trim();
    var amountRaw = document.getElementById("f-amount").value;

    if(!date || !category || !description){
      formError.textContent = "날짜, 카테고리, 내용은 비워 둘 수 없습니다.";
      return;
    }
    var amount = parseInt(amountRaw, 10);
    if(isNaN(amount)){
      formError.textContent = "금액은 정수로 입력해 주세요.";
      return;
    }
    if(amount <= 0){
      formError.textContent = "금액은 0보다 큰 값으로 입력해 주세요.";
      return;
    }

    var payload = { date:date, category:category, description:description, amount:amount };
    var request = state.editingId
      ? fetch(API + "/" + state.editingId, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
      : fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });

    request
      .then(function(res){ if(!res.ok) throw new Error("save failed"); return res.json(); })
      .then(function(rows){
        state.month = monthKey(date);
        formError.textContent = "";
        addForm.reset();
        addForm.classList.remove("open");
        state.editingId = null;
        submitLabel.textContent = "추가";
        applyRows(rows);
      })
      .catch(function(){ formError.textContent = "저장에 실패했습니다. 서버(server.py)가 실행 중인지 확인해 주세요."; });
  });

  fetchExpenses()
    .then(applyRows)
    .catch(function(){
      document.getElementById("statusText").textContent = "서버 연결 실패";
      document.getElementById("verdictTitle").textContent = "서버에 연결할 수 없습니다";
      document.getElementById("verdictBody").textContent = "chapter23_expense_tracker 폴더에서 \"python server.py\"를 실행한 뒤 이 페이지를 새로고침해 주세요.";
    });
})();
</script>
